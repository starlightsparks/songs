<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Widget</title>

<style>
body{
    margin:0;
    background:#191919;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:"Times New Roman", serif;
    color:white;
}

.player{
    width:260px;
    background:#232323;
    border-radius:14px;
    padding:16px;
    position:relative;
    box-sizing:border-box;
}

/* GEAR MOVED LEFT */
.gear{
    position:absolute;
    top:10px;
    left:10px;
    cursor:pointer;
    font-size:16px;
    opacity:.8;
}

.gear:hover{
    opacity:1;
}

/* MENU MOVED LEFT WITH GEAR */
.panel{
    position:absolute;
    top:38px;
    left:10px;
    width:160px;
    background:#2b2b2b;
    border-radius:10px;
    padding:8px;
    display:none;
    z-index:9999;
    box-shadow:0 0 20px rgba(0,0,0,.45);
}

.song{
    padding:7px;
    border-radius:6px;
    cursor:pointer;
    font-size:13px;
}

.song:hover{
    background:#3a3a3a;
}

.song.active{
    background:#39294f;
}

.cover{
    width:105px;
    height:105px;
    margin:10px auto 8px;
    border-radius:10px;
    object-fit:cover;
    display:block;
}

.title{
    text-align:center;
    font-size:14px;
    margin-bottom:10px;
}

.timebar{
    display:flex;
    align-items:center;
    gap:6px;
}

.playbtn{
    font-size:16px;
    cursor:pointer;
    user-select:none;
    padding:0 6px;
    transition:.2s;
    transform: translateY(-2px);
}

.playbtn:hover{
    color:#39294f;
}

.bar{
    flex:1;
    height:4px;
    background:#3a3a3a;
    border-radius:999px;
    cursor:pointer;
    position:relative;
}

.progress{
    position:absolute;
    left:0;
    top:0;
    height:100%;
    width:0%;
    background:#39294f;
    border-radius:999px;
}

.progress::after{
    content:"";
    position:absolute;
    right:-4px;
    top:50%;
    transform:translateY(-50%);
    width:8px;
    height:8px;
    border-radius:50%;
    background:#39294f;
}

.time{
    font-size:11px;
    opacity:.7;
    min-width:34px;
    text-align:center;
}
</style>
</head>

<body>

<div class="player">

    <div class="gear" onclick="togglePanel()">⚙</div>

    <div class="panel" id="panel"></div>

    <img id="cover" class="cover" src="cover.jpg" alt="cover">

    <div class="title" id="title">select a song</div>

    <div class="timebar">

        <div class="playbtn" id="playBtn" onclick="playPause()">▷</div>

        <span class="time" id="current">0:00</span>

        <div class="bar" onclick="seek(event)">
            <div class="progress" id="progress"></div>
        </div>

        <span class="time" id="duration">0:00</span>

    </div>

    <audio id="audio"></audio>

</div>

<script>
const audio = document.getElementById("audio");
const title = document.getElementById("title");
const cover = document.getElementById("cover");
const panel = document.getElementById("panel");
const progress = document.getElementById("progress");
const current = document.getElementById("current");
const duration = document.getElementById("duration");
const playBtn = document.getElementById("playBtn");

const songs = [
{
    name:"the cure",
    file:"song1.mp3",
    cover:"cover.jpg"
},
{
    name:"begged",
    file:"song2.mp3",
    cover:"cover.jpg"
},
{
    name:"stranger",
    file:"song3.mp3",
    cover:"cover.jpg"
}
];

let currentSong = 0;

function loadSong(index){
    currentSong = index;

    audio.src = songs[index].file;
    title.textContent = songs[index].name;
    cover.src = songs[index].cover;

    buildMenu();
}

function buildMenu(){
    panel.innerHTML = "";

    songs.forEach((song,index)=>{

        const item = document.createElement("div");

        item.className =
            "song" +
            (index === currentSong ? " active" : "");

        item.textContent = song.name;

        item.onclick = () => {
            loadSong(index);
            audio.play();
            playBtn.textContent = "||";
            panel.style.display = "none";
        };

        panel.appendChild(item);
    });
}

function playPause(){

    if(audio.paused){
        audio.play();
        playBtn.textContent = "||";
    }
    else{
        audio.pause();
        playBtn.textContent = "▷";
    }
}

function togglePanel(){
    panel.style.display =
        panel.style.display === "block"
        ? "none"
        : "block";
}

audio.addEventListener("timeupdate",()=>{

    const percent =
        (audio.currentTime / audio.duration) * 100;

    progress.style.width =
        (percent || 0) + "%";

    current.textContent =
        formatTime(audio.currentTime);

    duration.textContent =
        formatTime(audio.duration);
});

audio.addEventListener("ended",()=>{
    playBtn.textContent = "▷";
});

function seek(e){

    const rect =
        e.currentTarget.getBoundingClientRect();

    const clickX =
        e.clientX - rect.left;

    const percent =
        clickX / rect.width;

    audio.currentTime =
        percent * audio.duration;
}

function formatTime(seconds){

    if(!seconds || isNaN(seconds))
        return "0:00";

    const mins =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60);

    return mins + ":" +
        String(secs).padStart(2,"0");
}

loadSong(0);
</script>

</body>
</html>
